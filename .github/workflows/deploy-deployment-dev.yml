# Deploys the deployment_dev branch to Azure App Service (Linux, Node 22 LTS).
# The only workflow in this repository. No secret values here: the app name is
# the repository variable AZURE_WEBAPP_NAME and the publish profile is the
# repository secret AZURE_WEBAPP_PUBLISH_PROFILE. App settings (MONGODB_URI,
# JWT_SECRET, APP_ENV, NODE_ENV) live in Azure, never in the repository.
name: Deploy deployment_dev to Azure App Service

on:
  push:
    branches: [deployment_dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # No token left in .git/config: the whole checkout is uploaded below.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Runtime dependencies only; the package that is uploaded is the whole
      # checkout, so docs/openapi.yaml (read at start-up) is included.
      - run: npm ci --omit=dev

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
